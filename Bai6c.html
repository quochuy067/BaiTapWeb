<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date</title>

    <style>
        table {
            border: 1px solid blue;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 5px;
            text-align: center;
        }

        th {
            border-bottom: 1px solid blue;
        }
    </style>
</head>

<body>

    <div style="width: 280px; border: 2px solid blue; padding: 10px;">

        <form>

            <label for="name">Name:</label><br>
            <input type="text" id="name"><br><br>

            <label for="phone">Telephone Number:</label><br>
            <input type="tel" id="phone"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email"><br><br>

            <label for="color">Favorite Color:</label><br>
            <input type="color" id="color"><br><br>

            <label for="birthday">Date of Birth:</label><br>
            <input type="date" id="birthday" value="2015-07-16">

            <!-- Lịch hiện sẵn -->
            <table>
                <caption><b>July 2015</b></caption>

                <tr>
                    <th>Sun</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                </tr>

                <tr>
                    <td>28</td>
                    <td>29</td>
                    <td>30</td>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                </tr>

                <tr>
                    <td>5</td>
                    <td>6</td>
                    <td>7</td>
                    <td>8</td>
                    <td>9</td>
                    <td>10</td>
                    <td>11</td>
                </tr>

                <tr>
                    <td>12</td>
                    <td>13</td>
                    <td>14</td>
                    <td>15</td>
                    <td>16</td>
                    <td>17</td>
                    <td>18</td>
                </tr>

                <tr>
                    <td>19</td>
                    <td>20</td>
                    <td>21</td>
                    <td>22</td>
                    <td>23</td>
                    <td>24</td>
                    <td>25</td>
                </tr>

                <tr>
                    <td>26</td>
                    <td>27</td>
                    <td>28</td>
                    <td>29</td>
                    <td>30</td>
                    <td>31</td>
                    <td></td>
                </tr>
            </table>

            <br>

            <input type="submit" value="Submit">

        </form>

    </div>

</body>
</html>
