<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <div style="width: 550px; border: 2px solid lightblue; padding: 10px;">
        <form action="">
        <h2>Contact Us</h2>
        <fieldset>
            <legend>Your message:</legend>
            <table border="0">
            <tr>
                <td>
                    <label for="To">To</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Your Email">Your email</label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Message">Message</label>
                    <td><textarea rows="10" cols="50"></textarea></td>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Attach File">Attach File</label>
                </td>
                <td>
                    <input type="file">
                </td>
            </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>How you found us:</legend>
            <table border="0">
            <tr>
                <td>
                    <label for="How did you hear of us">How did you hear of us</label>
                </td>
                <td>
                <select name="" id="">
                    <option value="Google">Google</option>
                </select>
                </td>
            </tr>
            <tr>
                <td><label for="Newsletter">Newsletter</label></td>
                <td>
                    <input type="checkbox">Ensure this box is checked if you would like to receive email updates
                </td>
            </tr>
            </table>
        </fieldset>
        <button>Send message</button>
        </form>
    </div>
</body>
</html>
